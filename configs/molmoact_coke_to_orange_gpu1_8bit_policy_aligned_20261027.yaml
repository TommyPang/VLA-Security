# Policy-aligned orange teacher rollouts; retain prior rerun dataset/results.
# Fresh GPU1 coke-prompt -> orange-target rerun, 2026-10-26.
model:
  name: molmoact
  path: ${TRAP_MOLMOACT_MODEL_PATH}
data:
  path: ${VLA_SECURITY_ROOT}/datasets/molmoact_gpu1_8bit_policy_aligned_20261027
  env_name: GraspCokeOrangeScene-v0
  epoch_name: orange
  instruction: pick orange
  instruction_mapping: ${VLA_SECURITY_ROOT}/assets/instruction_mapping.json
  action_threshold: -1.0
  num_workers: 0
attack:
  steps: 1000
  batch_size: 1
  lr: 0.031372549
  optimizer: pgd
  alpha: 0.031372549
  quantize_to_8bit: true
  grad_accum_steps: 4
  include_cot_loss: true
  include_action_loss: true
  cot_weight: 1.0
  action_weight: 1.0
  action_traj_mode: predicted
  action_ss_prob: 1.0
  tv_weight: 10
  content_weight: 0.0
  reference_weight: 0.0
  best_patch_metric: loss
  content_loss_type: clip
  content_text: null
  reference_image: null
  save_every: 50
  loss_curve_every: 10
  validation:
    enabled: false
  preview_every: 0
  preview_max_new_tokens: 128
  create_run_dir: true
  camera_param_path: ${VLA_SECURITY_ROOT}/assets/molmoact/camera_params.npz
  patch_real_size: 0.2
  plane_z: 0.87
  allow_corner_fallback: false
  eval_image_size:
  - 256
  - 256
  patch:
    mode: pixel
    size:
    - 3
    - 180
    - 180
output_dir: ${VLA_SECURITY_ROOT}/outputs/molmoact_gpu1_8bit/policy_aligned_20261027_coke_to_orange/opt
device: cuda:0
seed: 0
