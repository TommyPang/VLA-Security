# Phased coke → orange attack (leftover #2): trajectory-first, then action-heavy.
# Phase A (first 40%): action_weight=0 → pure CoT/visual-trace redirect (establish the
#   orange-pointed trajectory; this is where the strongest redirect came from historically).
# Phase B (last 60%): action_weight jumps to action_weight_final under predicted-traj CE →
#   lock the discrete action onto the already-redirected trajectory without letting the
#   action objective drag the trajectory back toward coke from step 1.
# Everything else matches molmoact_coke_to_orange_gpu.yaml (table-plane, 0.20, 256 eval res).
model:
  name: molmoact
  path: ${TRAP_MOLMOACT_MODEL_PATH}
data:
  path: ${TRAP_MOLMOACT_DATA}
  env_name: GraspCokeOrangeScene-v0
  epoch_name: orange
  instruction: pick orange
  instruction_mapping: ${VLA_SECURITY_ROOT}/assets/instruction_mapping.json
  action_threshold: -1.0
  num_workers: 0
attack:
  steps: 1000
  batch_size: 1
  lr: 0.031372549
  optimizer: pgd
  alpha: 0.031372549
  quantize_to_8bit: true
  grad_accum_steps: 1
  include_cot_loss: true
  include_action_loss: true
  cot_weight: 1.0
  action_weight: 0.0          # phase A: no action term
  action_weight_final: 3.0    # phase B: action-heavy (predicted-traj CE)
  loss_weight_schedule_start_frac: 0.4  # step change at 40% of steps
  loss_weight_schedule_end_frac: 0.4
  action_traj_mode: predicted
  action_ss_prob: 1.0
  tv_weight: 10
  content_weight: 0.0
  reference_weight: 0.0
  # Phase jump makes total-loss scale shift, so patch_best (min loss) would be dominated by
  # the cheap phase-A steps. Evaluate patch_latest (final step) instead; see launch script.
  best_patch_metric: loss
  content_loss_type: clip
  content_text: null
  reference_image: null
  save_every: 50
  loss_curve_every: 10
  validation:
    enabled: false
  preview_every: 0
  preview_max_new_tokens: 128
  create_run_dir: true
  camera_param_path: ${VLA_SECURITY_ROOT}/assets/molmoact/camera_params.npz
  patch_real_size: 0.20
  plane_z: 0.87
  allow_corner_fallback: false
  eval_image_size: [256, 256]
  patch:
    mode: pixel
    size: [3, 128, 128]
output_dir: ${VLA_SECURITY_ROOT}/outputs/molmoact/GraspCokeOrangeScene-v0/coke_to_orange
device: cuda:0
seed: 0
